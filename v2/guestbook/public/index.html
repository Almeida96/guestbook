<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guestbook - v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"><h1>Guestbook - v2</h1></div>
  <main>
    <div id="guestbook-entries"><p>Loading messages...</p></div>
    <form id="guestbook-form">
      <label for="guestbook-entry-content">Write a message</label>
      <input id="guestbook-entry-content" type="text" autocomplete="off" required>
      <a href="#" id="guestbook-submit">Submit</a>
    </form>
    <h2 id="guestbook-host-address"></h2>
    <p><a href="env">/env</a> | <a href="info">/info</a></p>
  </main>
  <script src="jquery.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
